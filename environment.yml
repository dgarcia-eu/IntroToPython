# Local conda environment for the course.
#
#   conda env create -f environment.yml
#   conda activate introtopython
#   jupyter lab
#
# Most students will use the Anaconda installation described in setup/Anaconda.md
# and will never need this file. It is here for anyone who prefers the command
# line, and so that the environment the course was tested against is written down.
name: introtopython
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pandas>=2.2,<3
  - matplotlib>=3.9
  - numpy>=2.0
  - notebook
  - jupyterlab
  - ipykernel
